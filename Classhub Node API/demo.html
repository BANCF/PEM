<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classhub Pro API Demo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1f3c88; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #333; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-primary { background-color: #274c77; color: white; }
        .btn-primary:hover { background-color: #1a3a60; }
        .btn-success { background-color: #2a9d8f; color: white; }
        .btn-success:hover { background-color: #21867a; }
        .btn-warning { background-color: #e9c46a; color: #333; }
        .btn-warning:hover { background-color: #dfb24b; }
        .hidden { display: none; }
        
        #console-log {
            margin-top: 20px;
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.4;
        }
        .log-line { margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 3px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 Điểm Danh Tự Động</h2>
        
        <!-- BƯỚC 1: KẾT NỐI -->
        <div id="step-1">
            <div class="input-group">
                <label>Tên Giáo viên (BẮT BUỘC)</label>
                <input type="text" id="teacherName" placeholder="Nhập tên thật của bạn (VD: Vũ Hoàng Linh)">
            </div>
            <div class="input-group">
                <label>Cookie Đăng nhập (Dùng để Test tắt)</label>
                <input type="text" id="rawCookie" placeholder="Dán chùm Cookie vào đây (VD: OhkeSession=...; PHPSESSID=...)">
            </div>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px dashed #ccc;">
            <p style="text-align:center; font-size: 12px; color: #666;">-- Hoặc đăng nhập bằng Tài khoản (Đang bị Ohke chặn) --</p>
            
            <div class="input-group">
                <label>Tài khoản (Email)</label>
                <input type="text" id="username" placeholder="Nhập Email">
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập Mật khẩu">
            </div>
            
            <button class="btn-primary" id="btnConnect" onclick="connectSystem()">Kết Nối Hệ Thống</button>
        </div>

        <!-- BƯỚC 2 & 3: QUÉT VÀ ĐIỂM DANH -->
        <div id="step-2" class="hidden">
            <button class="btn-warning" id="btnScan" onclick="scanClasses()">🔍 Bắt đầu Quét Lớp</button>
            <div id="classListContainer" class="hidden">
                <table id="classesTable">
                    <thead><tr><th>Tên Lớp Học</th><th>Sĩ số</th></tr></thead>
                    <tbody></tbody>
                </table>
                <button class="btn-success" id="btnAttendance" onclick="startAttendance()">🚀 Tiến Hành Điểm Danh Tất Cả</button>
            </div>
        </div>

        <!-- CONSOLE LOG -->
        <div id="console-log">
            <div class="log-line">Khởi tạo hệ thống... Chờ kết nối SSE.</div>
        </div>
    </div>

    <script>
        const baseUrl = 'http://localhost:3000/api';
        let sseSource = null;

        // Khởi tạo SSE (Server-Sent Events) để lắng nghe Log từ Server
        function initSSE() {
            if (sseSource) sseSource.close();
            sseSource = new EventSource(`${baseUrl}/stream`);
            sseSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                appendLog(data.message);
            };
            sseSource.onerror = function() {
                appendLog("⚠️ [SYSTEM] Mất kết nối luồng Log từ máy chủ!");
                sseSource.close();
            };
        }

        function appendLog(msg) {
            const consoleDiv = document.getElementById('console-log');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight; // Tự cuộn xuống dưới cùng
        }

        async function connectSystem() {
            const teacherName = document.getElementById('teacherName').value.trim();
            const rawCookie = document.getElementById('rawCookie').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!teacherName) {
                alert("Vui lòng điền Tên Giáo viên!");
                return;
            }

            appendLog(`Đang gửi yêu cầu kết nối cho GV: ${teacherName}...`);
            document.getElementById('btnConnect').innerText = "Đang kết nối...";
            document.getElementById('btnConnect').disabled = true;

            try {
                let res = await fetch(`${baseUrl}/connect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        loginUrl: "https://idcloud.vn/61892/appstart/digitalismspace/login", 
                        username, password, teacherName, tenantId: "61892", rawCookie
                    })
                });
                let data = await res.json();
                
                if (data.success) {
                    appendLog("✅ KẾT NỐI THÀNH CÔNG: " + data.message);
                    document.getElementById('step-1').classList.add('hidden');
                    document.getElementById('step-2').classList.remove('hidden');
                    initSSE(); // Chỉ init SSE sau khi kết nối để bắt đầu hứng log quét lớp
                } else {
                    appendLog("❌ KẾT NỐI THẤT BẠI: " + data.message);
                    alert("Kết nối thất bại: " + data.message);
                }
            } catch(e) {
                appendLog("❌ LỖI HỆ THỐNG: " + e.message);
            }
            
            document.getElementById('btnConnect').innerText = "Kết Nối Hệ Thống";
            document.getElementById('btnConnect').disabled = false;
        }

        async function scanClasses() {
            document.getElementById('btnScan').innerText = "Đang quét...";
            document.getElementById('btnScan').disabled = true;
            appendLog("Đang gọi API Quét Lớp...");

            try {
                let res = await fetch(`${baseUrl}/scan`, { method: 'POST' });
                let data = await res.json();
                
                if (data.success) {
                    appendLog(`✅ QUÉT XONG: Tìm thấy ${data.count} lớp.`);
                    
                    // Render bảng
                    const tbody = document.querySelector('#classesTable tbody');
                    tbody.innerHTML = '';
                    if (data.count > 0) {
                        data.classes.forEach(c => {
                            let tr = document.createElement('tr');
                            let className = c.entity ? c.entity.class_name : 'Unknown';
                            let classTime = c.entity ? c.entity.class_hour_start_time : 'Unknown';
                            let classDate = c.entity && c.entity.class_schedule_date ? c.entity.class_schedule_date : 'Unknown';
                            tr.innerHTML = `<td>${className}</td><td>${classTime} (${classDate})</td>`;
                            tbody.appendChild(tr);
                        });
                        document.getElementById('classListContainer').classList.remove('hidden');
                        document.getElementById('btnScan').classList.add('hidden'); // Giấu nút quét
                    } else {
                        appendLog("⚠️ Không tìm thấy lớp nào của bạn. Hãy kiểm tra lại Tên Giáo Viên hoặc Cookie.");
                    }
                } else {
                    appendLog("❌ LỖI QUÉT: " + data.message);
                }
            } catch(e) {
                appendLog("❌ LỖI HỆ THỐNG: " + e.message);
            }

            document.getElementById('btnScan').innerText = "🔍 Bắt đầu Quét Lớp";
            document.getElementById('btnScan').disabled = false;
        }

        async function startAttendance() {
            document.getElementById('btnAttendance').innerText = "Đang điểm danh ngầm...";
            document.getElementById('btnAttendance').disabled = true;
            appendLog("Đang gọi API Điểm Danh...");

            try {
                let res = await fetch(`${baseUrl}/attendance`, { method: 'POST' });
                let data = await res.json();
                if (data.success) {
                    appendLog("ℹ️ Lệnh điểm danh đã được máy chủ tiếp nhận, đang chạy ngầm...");
                } else {
                    appendLog("❌ LỖI GỬI LỆNH: " + data.message);
                    document.getElementById('btnAttendance').disabled = false;
                    document.getElementById('btnAttendance').innerText = "🚀 Tiến Hành Điểm Danh Tất Cả";
                }
            } catch(e) {
                appendLog("❌ LỖI HỆ THỐNG: " + e.message);
                document.getElementById('btnAttendance').disabled = false;
                document.getElementById('btnAttendance').innerText = "🚀 Tiến Hành Điểm Danh Tất Cả";
            }
        }
    </script>
</body>
</html>
