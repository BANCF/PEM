<script>
  $(() => {
    const iosIcon = document.getElementById('ios-icon');
    const androidIcon = document.getElementById('android-icon');
    const separator = document.getElementById('icon-separator');
    const container = document.getElementById('app-icons');

    if (inno.env.isInApp) {
      container.remove()
    } else if (inno.env.isIOS) {
      androidIcon.remove()
      separator.remove()
      container.style.display = 'block';
    } else if (inno.env.isAndroid) {

    } else {
      container.style.display = 'block';
    }
  })

<script>
    $(() => {
    let $remember = $('#login-remember-me');
    if (localStorage.getItem('login-form-remember-me')) {
      $remember.attr('checked', true);
      autoLogin();
    }
    $remember.change(e => {
      let checked = e.target.checked ? 1 : 0;
      localStorage.setItem('login-form-remember-me', checked);
    })
  })

  function autoLogin() {
    var $loading = $('#login-submit-btn').find('.fa');
    if (!$loading.length || !$loading.hasClass('w3-hide')) return;
    $loading.removeClass('w3-hide');
    Ohke.rpc2(`${Ohke.APP_URL}/jsonPostAutoSignIn`, {
      background: 1,
      method: 'POST',
      data: {
        'login-form': {
        }
      }
    }).then(res => {
      if (res && res.type == 'success' && res.data && res.data.redirect) {
        location.href = res.data.redirect;
      }
      $loading.addClass('w3-hide');
    }, e => {
      $loading.addClass('w3-hide');
    });
  }
  
  function login(form) {
    var $loading = $(form).find('button[type=submit] .fa');
    if (!$loading.length || !$loading.hasClass('w3-hide')) return;
    $loading.removeClass('w3-hide');
    var data = Ohke.form.getData(form);
    Ohke.rpc2(`${Ohke.APP_URL}/jsonPostSignIn`, {
      background: 1,
      method: 'POST',
      data: {
        'login-form': data
      },
      form: '#login-form'
    }).then(res => {
      $loading.addClass('w3-hide');
      if (res && res.type == 'success') {
        data = res.data;
        if (data.redirect) {
          location.href = data.redirect;
        } else if (data.error)
          Ohke.popup.error({text: data.error})
        else if (data.info)
          Ohke.popup.info({text: data.info})
      }
    }, () => {
      $loading.addClass('w3-hide');
    });
  }

  function warningLongTime() {
    let $form = $('#login-form');
    let $div = $('<div class="ohke-control">');
    let msg = 'You stay in this form too long time! This form will auto reload after %s second(s)';
    let countDown = 30;
    msg = msg.replace('%s', `<b id="reload-timer">${countDown}</b>`);
    $div.html(`<ul class="invalid-message"><li>${msg}</li></ul>`);
    $div.find('li').css('font-size', '1.5em');
    let $timer = $div.find('#reload-timer');
    $div.insertBefore($form.find('.invalid-container'));
    setInterval(() => {
      $timer.text(--countDown);
      if (countDown <= 0) {
        location.reload();
      }
    }, 1000);
  }

  Ohke.form.init('#login-form');
  setTimeout(warningLongTime, 15 * 60 * 1000)
</script>
