<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>PAS Fanpage Helper</h1>

  <fieldset id="pemBox">
    <legend>Kết nối PEM</legend>
    <div id="pemDisconnected">
      <label>Địa chỉ PEM
        <input id="pemUrl" type="text" value="https://pem-snowy.vercel.app">
      </label>
      <label>Mã kết nối PEM
        <input id="pemToken" type="text" placeholder="PEM-XXXX-XXXX-XXXX-XXXX">
      </label>
      <button id="pemConnect" class="full">Kết nối</button>
      <p class="hint">Lấy mã ở PEM → menu <b>Tương tác Fanpage</b> → Tạo mã kết nối.</p>
    </div>
    <div id="pemConnected" hidden>
      <div id="pemWho" class="ok"></div>
      <label class="check"><input id="useServerConfig" type="checkbox" checked> Dùng link fanpage và câu bình luận do BGH cài trên PEM</label>
      <div class="row buttons">
        <button id="pemSync" class="secondary">Đồng bộ nhật ký lên PEM</button>
        <button id="pemDisconnect" class="secondary">Ngắt kết nối</button>
      </div>
    </div>
  </fieldset>

  <label>Link fanpage
    <input id="pageUrl" type="text" placeholder="https://www.facebook.com/tieuhoc.thcspascal">
  </label>
  <button id="openPage" class="secondary">Mở fanpage</button>

  <div class="row">
    <label>Tháng <select id="month"></select></label>
    <label>Năm <input id="year" type="number" min="2015" max="2100"></label>
  </div>
  <label class="check"><input id="useFilter" type="checkbox" checked> Dùng bộ lọc tháng của Facebook</label>

  <fieldset>
    <legend>Thao tác</legend>
    <label class="check"><input id="doLike" type="checkbox" checked> Thích</label>
    <label class="check"><input id="doShare" type="checkbox" checked> Chia sẻ</label>
    <label class="check sub"><input id="autoShare" type="checkbox" checked> Tự bấm "Chia sẻ ngay" (không cần xác nhận)</label>
    <label class="check"><input id="doComment" type="checkbox" checked> Bình luận</label>
  </fieldset>

  <label>Câu bình luận mẫu (mỗi dòng 1 câu, chọn ngẫu nhiên)
    <textarea id="comments" rows="5"></textarea>
  </label>

  <label>Chế độ
    <select id="mode">
      <option value="semi">Bán tự động (khuyên dùng)</option>
      <option value="auto">Tự động hoàn toàn</option>
    </select>
  </label>
  <p id="autoWarn" class="warn" hidden>⚠ Chế độ tự động dễ bị Facebook phát hiện, có thể bị chặn tính năng hoặc khoá tài khoản tạm thời. Nên để độ trễ lớn và ít bài mỗi lượt.</p>

  <div class="row">
    <label>Tối đa bài/lượt <input id="maxPosts" type="number" min="1" max="100"></label>
    <label>Trễ (giây) <span class="pair"><input id="minDelay" type="number" min="2"> – <input id="maxDelay" type="number" min="3"></span></label>
  </div>

  <div class="row buttons">
    <button id="start">▶ Bắt đầu</button>
    <button id="stop" class="danger">■ Dừng</button>
  </div>

  <fieldset>
    <legend>Nhật ký</legend>
    <div id="logInfo">-</div>
    <div class="row buttons">
      <button id="copyLinks" class="secondary">Copy link (tháng đã chọn)</button>
      <button id="exportCsv" class="secondary">Xuất CSV</button>
    </div>
    <button id="clearLog" class="link">Xoá nhật ký</button>
  </fieldset>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
